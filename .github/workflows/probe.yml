name: WA-Regeln und Beispieldaten laden

# Lädt die WA-Ranking-Regeln und Beispiel-Events nach research/out (z. B. wenn WA die Regeln
# für ein neues Jahr veröffentlicht). Danach: python3 research/build_placing_sql.py
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx research/probe.ts
      - name: Ergebnisse committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/out
          git commit -m "WA-Probe: Rohdaten" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
