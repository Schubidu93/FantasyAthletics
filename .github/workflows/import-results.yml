name: Ergebnisse laden (World Athletics)

# Gestartet vom Zeitplaner in der Datenbank:
# - stündlich 8–23 Uhr "neu": ein Sammelabruf zeigt, wer in den letzten Wochen neue Ergebnisse hat;
#   nur diese Athleten werden einzeln (mit WA-Punkten) nachgeladen
# - 3 Uhr "nacht": neue Pool-Athleten komplett (aktuelles Jahr + Vorjahr) und ein Siebtel aller Athleten zur Kontrolle
# Von Hand: "voll" lädt alle Athleten komplett (optional mit Vorjahr).

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "neu = nur neue Ergebnisse, nacht = Kontrolle, voll = alle Athleten komplett"
        type: choice
        options: [neu, nacht, voll]
        default: neu
      vorjahr:
        description: "Bei „voll“ auch das Vorjahr laden"
        type: boolean
        default: false

concurrency:
  group: wa-import
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Jahre festlegen
        run: |
          Y=$(TZ=Europe/Berlin date +%Y)
          if [ "${{ inputs.vorjahr }}" = "true" ]; then echo "RESULT_YEARS=$Y,$((Y-1))" >> "$GITHUB_ENV"; else echo "RESULT_YEARS=$Y" >> "$GITHUB_ENV"; fi
      - run: npm run import:results
        env:
          MODUS: ${{ inputs.modus || 'neu' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WA_API_URL: ${{ secrets.WA_API_URL }}
          WA_API_KEY: ${{ secrets.WA_API_KEY }}
