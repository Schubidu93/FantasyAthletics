name: WA-Sammelabruf prüfen

# Erkundung: liefert der Sammelabruf (resultsByAthlete) noch alle Ergebnisse der letzten Wochen?
# Vergleicht mit dem Einzelabruf; Ergebnis in research/out/calendar/feed-log.txt.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx research/probe-feed.ts
      - name: Ergebnisse committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/out/calendar/feed-log.txt
          git commit -m "WA-Sammelabruf: Prüfergebnis" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
