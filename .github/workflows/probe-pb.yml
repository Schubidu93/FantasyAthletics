name: WA erkunden (Erkundungs-Skripte)

# Erkundungen bei World Athletics (z. B. Bestleistungen, Meisterschaften in offenen Rennen). Ergebnis in research/out/.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Erkundungs-Skript (research/…)"
        default: research/probe-pb.ts

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Skript ausführen
        env:
          SCRIPT: ${{ inputs.script || 'research/probe-pb.ts' }}
        run: |
          case "$SCRIPT" in research/probe-*.ts) ;; *) echo "::error::Nur research/probe-*.ts erlaubt"; exit 1;; esac
          npx tsx "$SCRIPT"
      - name: Ergebnisse committen
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/out
          git commit -m "WA-Bestleistungen: Erkundung" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
