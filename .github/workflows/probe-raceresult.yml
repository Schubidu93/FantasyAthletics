name: RaceResult erkunden

# Einmalige Erkundung: Nutzungsbedingungen und Aufbau der Ergebnislisten bei RaceResult.
on:
  push:
    branches: [claude/sleepy-planck-h90ess]
    paths: [research/probe-raceresult.ts]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx research/probe-raceresult.ts
      - name: Ergebnisse committen
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -f research/out/raceresult
          git commit -m "RaceResult: Erkundung" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
